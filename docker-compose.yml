# ============================================================================
# ДЕМОНСТРАЦИОННЫЙ ЗАПУСК ДЛЯ СЕРВЕРА И ЖЮРИ ХАКАТОНА ОДНОЙ КОМАНДОЙ:
#   docker compose up -d --build
# ============================================================================

services:
  geo-vega-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geo-vega-dashboard
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - HOST=0.0.0.0
      - PRODUCTION=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/batch-status"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
