[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geo-vega"
version = "1.0.0"
description = "GEO-VEGA: Мониторинг вегетационной динамики с/х территорий, реконструкция рядов ДЗЗ и детекция аномалий (Космохакатон 2026)"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Команда GEO-VEGA" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
    "earthengine-api>=1.1.5",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "matplotlib>=3.7.0",
    "plotly>=5.15.0"
]

[project.scripts]
geovega-train = "train:main"
geovega-predict = "predict_submission:main"
geovega-anomalies = "detect_anomalies:main"
geovega-server = "run_server:main"
